  background: var(--color-panel-hover);
  font-size: 13px;
}

.home-inspection-details {

.home-inspection-details strong {

}

}

.home-tumbler-stage {

  padding: var(--space-5);

  border: 1px solid var(--color-line);
  border-radius: var(--radius-panel);
  background:

  perspective: 900px;
}

.home-tumbler {
  width: min(190px, 38vw);

  transform: translate3d(var(--tumbler-x, 0px), var(--tumbler-y, 0px), 0) rotateY(var(--tumbler-rotate, 0deg));

  transition: transform 180ms cubic-bezier(0.2, 0.75, 0.25, 1);
  will-change: transform;
}

.weight-range,
.inspection-submit-result {
  margin: var(--space-4) 0 0;

}

.image-previews,

  border-radius: var(--radius-control);
}

.inspection-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3) var(--space-5);

  border-radius: var(--radius-panel);
  background: var(--color-panel);
}

.inspection-summary p {

}

  color: var(--color-ink-muted);

.inspection-tabs button[aria-selected="true"] {

.inspection-tab-panel {
  min-height: 48px;
  padding-top: var(--space-5);
}

.inspection-detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
  gap: var(--space-5);
}

.detail-main-image {
  display: grid;
  width: 100%;
  aspect-ratio: 4 / 3;
  place-items: center;
  overflow: clip;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-panel);
  background: var(--color-panel);
}

.detail-main-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.detail-thumbnails button {
  width: 68px;
  height: 68px;
  margin: 0;
  padding: var(--space-1);
  overflow: clip;
  border: 1px solid var(--color-line);
  background: transparent;
}

.detail-thumbnails button[aria-current="true"] {
  border: 1px solid var(--color-accent);

  outline-offset: 2px;
  background: var(--color-panel-hover);
  color: var(--color-accent);
}

.detail-thumbnails img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--radius-control);
}

.detail-values div {

.detail-values dt {

}

label {

  margin: var(--space-4) 0 var(--space-2);

  font-size: 14px;
  font-weight: 600;
}

input,
select,
textarea {
  box-sizing: border-box;
  width: 100%;
  min-height: 44px;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-control);
  color: var(--color-ink);
  background: var(--color-panel);
  font: inherit;
}

textarea {
  min-height: 112px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}

button {
  width: 100%;
  min-height: 44px;
  margin-top: var(--space-5);
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-accent);
  border-radius: var(--radius-control);
  color: var(--color-accent-ink);
  background: var(--color-accent);
  font: inherit;
  font-weight: 650;
  cursor: pointer;
  transition: background-color var(--motion-fast) ease, transform var(--motion-fast) ease;
}

button:hover:not(:disabled) {
  background: var(--color-accent-bright);
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  cursor: not-allowed;
  color: var(--color-disabled-ink);
  background: var(--color-panel-hover);
  border-color: var(--color-line);
  opacity: 0.65;
}

a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {

}

.error-message {
  margin: var(--space-4) 0 0;
}

@media (max-width: 700px) {
  .app-header {

    gap: var(--space-3);
    padding: var(--space-2) var(--space-4);

  .brand-link {
    gap: var(--space-2);
    font-size: 16px;
  }

  .brand-link img {
    width: 40px;

  }

  .header-actions,
  .header-actions nav {
    gap: var(--space-2);
  }

  .header-user {
    display: none;
  }

  .yellow-notice {
    padding: var(--space-3) var(--space-4);
  }

  .page-content {
    padding: var(--space-5) var(--space-3);
  }

  #app-screen {
    padding: var(--space-5) var(--space-4);
  }

  .home-summary-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .screen-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: var(--space-3);
  }
}

@media (max-width: 640px) {
  .inspection-detail-grid,
  .inspection-summary {
    grid-template-columns: 1fr;
  }

  .home-inspection-card {
    grid-template-columns: 88px minmax(0, 1fr);

  .home-inspection-card img,
  .home-inspection-photo-placeholder {
    width: 88px;
    height: 72px;
  }

  .home-tumbler {
    transition: none;
    transform: none;

  }

  .brand-link img {
    animation: none;

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

                  <title id="home-tumbler-title">초록색 스테인리스 텀블러</title>
                  <defs>
                    <linearGradient id="cup-body" x1="0" y1="0" x2="1" y2="0">
                      <stop offset="0" stop-color="#1b684e" />
                      <stop offset="0.2" stop-color="#48c79b" />
                      <stop offset="0.46" stop-color="#16835f" />
                      <stop offset="0.72" stop-color="#0d5944" />
                      <stop offset="1" stop-color="#43b789" />
                    </linearGradient>
                    <linearGradient id="cup-lid" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#dce8e1" />
                      <stop offset="0.45" stop-color="#91a99d" />
                      <stop offset="1" stop-color="#48685a" />
                    </linearGradient>
                    <linearGradient id="cup-base" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#24463a" />
                      <stop offset="1" stop-color="#0a211a" />
                    </linearGradient>
                  </defs>
                  <ellipse cx="110" cy="276" rx="58" ry="11" fill="#000" opacity="0.28" />
                  <path d="M63 79h94l-9 164c-.7 13-10 22-23 22H95c-13 0-22-9-23-22L63 79Z" fill="url(#cup-body)" stroke="#77e2bd" stroke-opacity="0.58" stroke-width="2" />
                  <path d="M76 91 84 234c.5 8 3 13 8 16" fill="none" stroke="#c2ffe5" stroke-opacity="0.38" stroke-linecap="round" stroke-width="5" />
                  <path d="M143 92 136 235" fill="none" stroke="#052a20" stroke-opacity="0.4" stroke-linecap="round" stroke-width="7" />
                  <path d="M62 73c0-7 5-12 12-12h72c7 0 12 5 12 12v13H62V73Z" fill="url(#cup-lid)" stroke="#dce8e1" stroke-width="2" />
                  <path d="M83 47h54c7 0 12 5 12 12v7H71v-7c0-7 5-12 12-12Z" fill="#8da79a" stroke="#d9e7df" stroke-width="2" />
                  <path d="M91 40h38v9H91z" rx="4" fill="#dce8e1" />
                  <path d="M85 109c10-8 40-8 50 0" fill="none" stroke="#a4f4d4" stroke-opacity="0.85" stroke-width="2" />
                  <circle cx="110" cy="162" r="23" fill="#062a20" fill-opacity="0.28" stroke="#a0e9ca" stroke-opacity="0.9" stroke-width="2" />
                  <path d="M98 168c7-13 17-20 24-20-1 15-8 24-21 27" fill="none" stroke="#c7ffe6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" />
                  <path d="M96 174c7-7 16-11 27-13" fill="none" stroke="#c7ffe6" stroke-linecap="round" stroke-width="2" />
                  <path d="M72 241c25 7 61 7 76 0" fill="none" stroke="#b2f5d8" stroke-opacity="0.8" stroke-width="2" />
                  <path d="M80 250c18 8 46 8 60 0" fill="none" stroke="url(#cup-base)" stroke-linecap="round" stroke-width="8" />
                  <path d="M69 78h82" fill="none" stroke="#f2fff9" stroke-opacity="0.7" stroke-width="2" />
                </svg>
              </div>
          </section>
          <section id="settings-view" hidden>
            <h2>저장소 상태</h2>
            <p id="storage-status" role="status">저장소 상태를 불러오는 중입니다.</p>
          </section>
          <section id="new-inspection-view" hidden>
            <form id="inspection-form" class="inspection-form">
              <label for="product-select">제품</label>
              <select id="product-select" name="product_id" required></select>

              <label for="inspected-at">검사일시</label>
              <input id="inspected-at" name="inspected_at" type="datetime-local" step="1" required />

              <label for="revision-select">검사기준</label>
              <select id="revision-select" name="revision" required>
                <option value="Rev.A">Rev.A</option>
                <option value="Rev.B">Rev.B</option>
              </select>

              <label for="weight-input">중량(g)</label>
              <input id="weight-input" name="weight_g" type="number" step="any" />

              <label for="memo-input">메모</label>
              <textarea id="memo-input" name="memo"></textarea>

              <p id="weight-range" class="weight-range" aria-live="polite"></p>

              <label for="inspection-images">사진</label>
              <input id="inspection-images" name="images" type="file" accept="image/*" multiple />
              <div id="image-previews" class="image-previews" aria-live="polite"></div>
              <button id="inspection-submit" type="submit">검사 등록</button>
              <p id="inspection-submit-error" class="error-message" role="alert" hidden></p>
              <p id="inspection-submit-result" class="inspection-submit-result" role="status" hidden></p>
            </form>
          </section>
          <section id="inspection-detail-view" hidden>
            <p id="inspection-detail-error" class="inspection-detail-error" role="alert" hidden></p>
            <div id="inspection-detail-content" hidden>
              <div class="inspection-summary">
                <p>검사번호: <strong id="detail-inspection-id"></strong></p>
                <p>제품: <strong id="detail-product-name"></strong></p>
                <p>판정: <strong id="detail-decision"></strong></p>
                <p id="detail-content-version"></p>
              </div>
              <div class="inspection-tabs" role="tablist" aria-label="검사 상세 탭">
                <button type="button" role="tab" id="detail-tab-1" aria-selected="true" aria-controls="detail-panel">① 사진·측정값</button>
                <button type="button" role="tab" id="detail-tab-2" aria-selected="false" aria-controls="detail-panel">② AI 결과 확인</button>
                <button type="button" role="tab" id="detail-tab-3" aria-selected="false" aria-controls="detail-panel">③ 검사기준과 비교하기</button>
                <button type="button" role="tab" id="detail-tab-4" aria-selected="false" aria-controls="detail-panel">④ 내 판단 기록</button>
              </div>
              <div id="detail-panel" class="inspection-tab-panel" role="tabpanel" aria-labelledby="detail-tab-1">
                <div id="detail-photo-measurement" class="inspection-detail-grid">
                  <div>
                    <div id="detail-main-image" class="detail-main-image"></div>
                    <div id="detail-thumbnails" class="detail-thumbnails" aria-label="검사 사진"></div>
                  </div>
                  <dl class="detail-values">
                    <div><dt>제품</dt><dd id="detail-value-product"></dd></div>
                    <div><dt>검사일시</dt><dd id="detail-value-date"></dd></div>
                    <div><dt>검사기준</dt><dd id="detail-value-revision"></dd></div>
                    <div><dt>중량</dt><dd id="detail-value-weight"></dd></div>
                    <div><dt>메모</dt><dd id="detail-value-memo"></dd></div>
                  </dl>
                  <form id="detail-edit-form" class="detail-edit">
                    <label for="detail-edit-product">제품</label>
                    <select id="detail-edit-product" name="product_id" required></select>

                    <label for="detail-edit-date">검사일시</label>
                    <input id="detail-edit-date" name="inspected_at" type="datetime-local" step="1" required />

                    <label for="detail-edit-weight">중량(g)</label>
                    <input id="detail-edit-weight" name="weight_g" type="number" step="any" />

                    <button id="detail-edit-save" type="submit">저장</button>
                    <p id="detail-edit-error" class="error-message" role="alert" hidden></p>
                  </form>
                </div>
              </div>
            </div>
          </section>
          <section id="not-found-view" hidden>
            <p>페이지를 찾을 수 없습니다</p>
            <a href="/" data-link>홈으로 가기</a>
          </section>
        </main>
      </div>
    </div>

    <footer id="app-footer" class="app-footer" hidden>텀블러 공장 품질관리 시스템입니다.</footer>

    <script>
      const loginBox = document.querySelector('#login-box');
      const loginForm = document.querySelector('#login-form');
      const loginButton = document.querySelector('#login-button');
      const logoutButton = document.querySelector('#logout-button');
      const loginError = document.querySelector('#login-error');
      const appScreen = document.querySelector('#app-screen');
      const headerActions = document.querySelector('#header-actions');
      const headerUser = document.querySelector('#header-user');
      const yellowNotice = document.querySelector('#yellow-notice');
      const appFooter = document.querySelector('#app-footer');
      const screenTitle = document.querySelector('#screen-title');
      const newInspectionLink = document.querySelector('#new-inspection-link');
      const homeView = document.querySelector('#home-view');
      const settingsView = document.querySelector('#settings-view');
      const storageStatus = document.querySelector('#storage-status');
      let storageStatusRequestId = 0;
      const homeDate = document.querySelector('#home-date');
      const homeSummaryError = document.querySelector('#home-summary-error');
      const homeListError = document.querySelector('#home-list-error');
      const homeInspectionList = document.querySelector('#home-inspection-list');
      const homeTumbler = document.querySelector('.home-tumbler');
      let homeRequestId = 0;
      let homeListRequestId = 0;
      let activeHomeFilter = null;
      const newInspectionView = document.querySelector('#new-inspection-view');
      const inspectionDetailView = document.querySelector('#inspection-detail-view');
      const inspectionDetailContent = document.querySelector('#inspection-detail-content');
      const inspectionDetailError = document.querySelector('#inspection-detail-error');
      const detailTabs = Array.from(document.querySelectorAll('.inspection-tabs [role="tab"]'));
      const detailPanel = document.querySelector('#detail-panel');
      const detailMainImage = document.querySelector('#detail-main-image');
      const detailThumbnails = document.querySelector('#detail-thumbnails');
      const detailEditForm = document.querySelector('#detail-edit-form');
      const detailEditSave = document.querySelector('#detail-edit-save');
      const detailEditError = document.querySelector('#detail-edit-error');
      const inspectionForm = document.querySelector('#inspection-form');
      const productSelect = document.querySelector('#product-select');
      const inspectedAtInput = document.querySelector('#inspected-at');
      const revisionSelect = document.querySelector('#revision-select');
      const weightRange = document.querySelector('#weight-range');
      const inspectionImages = document.querySelector('#inspection-images');
      const imagePreviews = document.querySelector('#image-previews');
      const inspectionSubmit = document.querySelector('#inspection-submit');
      const inspectionSubmitError = document.querySelector('#inspection-submit-error');
      const inspectionSubmitResult = document.querySelector('#inspection-submit-result');
      const notFoundView = document.querySelector('#not-found-view');
      const roleLabels = { writer: '작성자', reviewer: '검토자', 'factory-user': '품질관리' };
      let selectedImageDataUrls = [];
      let imageSelectionVersion = 0;

      function showLoginError(message) {
        loginError.textContent = message;
        loginError.hidden = false;
      }

      function renderScreen() {
        const route = window.location.pathname;
        const isHome = route === '/';
        const isSettings = route === '/settings';
        const isNewInspection = route === '/inspections/new';
        const detailMatch = route.match(/^\/inspections\/([^/]+)$/);
        const isInspectionDetail = Boolean(detailMatch);
        let title = '품질 현황';

        if (isNewInspection) title = '검사 등록';
        else if (isSettings) title = '설정';
        else if (isInspectionDetail) title = '검사 상세';
        else if (route === '/settings') title = '설정';
        else if (!isHome) title = '';

        screenTitle.textContent = title;
        homeView.hidden = !isHome;
        settingsView.hidden = !isSettings;
        newInspectionView.hidden = !isNewInspection;
        inspectionDetailView.hidden = !isInspectionDetail;
        notFoundView.hidden = title !== '';
        newInspectionLink.hidden = !isHome;

        if (isNewInspection) {
          setDefaultInspectionDate();
          loadProducts();
        }
        if (isHome && loginBox.hidden) loadHomeSummary();
        if (isSettings && loginBox.hidden) loadStorageStatus();
        if (isInspectionDetail && loginBox.hidden) loadInspectionDetail(decodeURIComponent(detailMatch[1]));
      }

      async function loadStorageStatus() {
        const requestId = ++storageStatusRequestId;
        storageStatus.textContent = '저장소 상태를 불러오는 중입니다.';
        try {
          const response = await fetch('/api/operations');
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '저장소 상태를 불러오지 못했습니다.');
          if (requestId !== storageStatusRequestId || window.location.pathname !== '/settings') return;
          storageStatus.textContent = `저장소: ${result.label}`;
        } catch (error) {
          if (requestId !== storageStatusRequestId || window.location.pathname !== '/settings') return;
          storageStatus.textContent = '저장소: 내 컴퓨터(mock)';
        }
      }

      async function loadHomeSummary() {
        const requestId = ++homeRequestId;
        homeSummaryError.hidden = true;
        const query = homeDate.value ? `?date=${encodeURIComponent(homeDate.value)}` : '';
        try {
          const response = await fetch(`/api/home${query}`);
          const summary = await response.json();
          if (requestId !== homeRequestId || window.location.pathname !== '/') return;
          if (!response.ok || summary.error) {
            throw new Error(summary.error || '하루 현황을 불러오지 못했습니다.');
          }
          if (!homeDate.value && summary.date) homeDate.value = summary.date;
          document.querySelector('#home-total').textContent = summary.total;
          document.querySelector('#home-ng').textContent = summary.ng;
          document.querySelector('#home-hold').textContent = summary.hold;
          document.querySelector('#home-review-pending').textContent = summary.review_pending;
          await loadHomeInspections();
        } catch (error) {
          if (requestId !== homeRequestId) return;
          homeSummaryError.textContent = error.message || '하루 현황을 불러오지 못했습니다.';
          homeSummaryError.hidden = false;
        }
      }

      async function loadHomeInspections() {
        const requestId = ++homeListRequestId;
        homeListError.hidden = true;
        const params = new URLSearchParams();
        if (homeDate.value) params.set('date', homeDate.value);
        if (activeHomeFilter === 'NG' || activeHomeFilter === 'HOLD') {
          params.set('decision', activeHomeFilter);
        } else if (activeHomeFilter === 'review-pending') {
          params.set('review', 'pending');
        }
        const query = params.toString();
        try {
          const response = await fetch(`/api/inspections${query ? `?${query}` : ''}`);
          const inspections = await response.json();
          if (requestId !== homeListRequestId || window.location.pathname !== '/') return;
          if (!response.ok || !Array.isArray(inspections)) {
            throw new Error(inspections.error || '검사 목록을 불러오지 못했습니다.');
          }

          homeInspectionList.replaceChildren();
          if (inspections.length === 0) {
            const message = document.createElement('p');
            message.className = 'home-list-message';
            message.textContent = activeHomeFilter
              ? '이 날짜에 이 종류의 검사가 없습니다.'
              : '이 날짜에 등록한 검사가 없습니다.';
            homeInspectionList.append(message);
            return;
          }

          const productNames = {
            'P-SILVER': '텀블러 실버',
            'P-WHITE': '텀블러 화이트',
            'P-BLACK': '텀블러 블랙',
          };
          const decisionLabels = { OK: '정상', NG: '불량', HOLD: '보류' };

          inspections.forEach((inspection) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'home-inspection-card';
            card.addEventListener('click', () => navigate(`/inspections/${encodeURIComponent(inspection.inspection_id)}`));

            if (Array.isArray(inspection.images) && inspection.images.length > 0) {
              const image = document.createElement('img');
              image.src = inspection.images[0];
              image.alt = '';
              card.append(image);
            } else {
              const placeholder = document.createElement('span');
              placeholder.className = 'home-inspection-photo-placeholder';
              placeholder.textContent = '사진 없음';
              card.append(placeholder);
            }

            const details = document.createElement('span');
            details.className = 'home-inspection-details';
            const id = document.createElement('strong');
            id.textContent = inspection.inspection_id;
            const product = document.createElement('span');
            product.textContent = productNames[inspection.product_id] || inspection.product_id;
            const weight = document.createElement('span');
            weight.textContent = inspection.weight_g === null ? '미측정' : `${inspection.weight_g}g`;
            const decision = document.createElement('span');
            decision.textContent = decisionLabels[inspection.decision] || '미판정';
            details.append(id, product, weight, decision);
            card.append(details);
            homeInspectionList.append(card);
          });
        } catch (error) {
          if (requestId !== homeListRequestId) return;
          homeListError.textContent = error.message || '검사 목록을 불러오지 못했습니다.';
          homeListError.hidden = false;
        }
      }

      async function loadInspectionDetail(inspectionId) {
        inspectionDetailError.hidden = true;
        inspectionDetailContent.hidden = true;
        try {
          const response = await fetch(`/api/inspections/${encodeURIComponent(inspectionId)}`);
          const inspection = await response.json();
          if (!response.ok || inspection.error) {
            throw new Error(inspection.error || '검사를 불러오지 못했습니다.');
          }

          const productNames = {
            'P-SILVER': '텀블러 실버',
            'P-WHITE': '텀블러 화이트',
            'P-BLACK': '텀블러 블랙',
          };
          const decisionLabels = { OK: '정상', NG: '불량', HOLD: '보류' };
          document.querySelector('#detail-inspection-id').textContent = inspection.inspection_id;
          document.querySelector('#detail-product-name').textContent = productNames[inspection.product_id] || inspection.product_id;
          document.querySelector('#detail-decision').textContent = decisionLabels[inspection.decision] || '미판정';
          document.querySelector('#detail-content-version').textContent = `검사 기록 버전: ${inspection.content_version}`;
          document.querySelector('#detail-value-product').textContent = productNames[inspection.product_id] || inspection.product_id;
          document.querySelector('#detail-value-date').textContent = inspection.inspected_at;
          document.querySelector('#detail-value-revision').textContent = inspection.revision;
          document.querySelector('#detail-value-weight').textContent = inspection.weight_g === null ? '미측정' : `${inspection.weight_g}g`;
          document.querySelector('#detail-value-memo').textContent = inspection.memo || '없음';
          populateDetailProductOptions(inspection.product_id);
          document.querySelector('#detail-edit-date').value = inspection.inspected_at.replace(' ', 'T');
          document.querySelector('#detail-edit-weight').value = inspection.weight_g ?? '';
          detailEditError.hidden = true;
          renderDetailImages(Array.isArray(inspection.images) ? inspection.images : []);
          selectDetailTab(0);
          inspectionDetailContent.hidden = false;
        } catch (error) {
          inspectionDetailError.textContent = error.message || '검사를 불러오지 못했습니다.';
          inspectionDetailError.hidden = false;
        }
      }

      function selectDetailTab(selectedIndex) {
        detailTabs.forEach((tab, index) => {
          const selected = index === selectedIndex;
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        detailPanel.setAttribute('aria-labelledby', detailTabs[selectedIndex].id);
        const detailPhotoMeasurement = document.querySelector('#detail-photo-measurement');
        detailPhotoMeasurement.hidden = selectedIndex !== 0;
        let placeholder = document.querySelector('#detail-tab-placeholder');
        if (selectedIndex === 0) {
          if (placeholder) placeholder.remove();
          return;
        }
        if (!placeholder) {
          placeholder = document.createElement('p');
          placeholder.id = 'detail-tab-placeholder';
          detailPanel.append(placeholder);
        }
        placeholder.textContent = '이 탭은 나중 회차에서 만듭니다.';
      }

      function renderDetailImages(images) {
        detailMainImage.replaceChildren();
        detailThumbnails.replaceChildren();
        if (images.length === 0) {
          detailMainImage.textContent = '등록된 사진이 없습니다.';
          return;
        }

        const showImage = (imageUrl, selectedIndex) => {
          const mainImage = document.createElement('img');
          mainImage.src = imageUrl;
          mainImage.alt = `검사 사진 ${selectedIndex + 1}`;
          detailMainImage.replaceChildren(mainImage);
          Array.from(detailThumbnails.querySelectorAll('button')).forEach((button, index) => {
            button.setAttribute('aria-current', String(index === selectedIndex));
          });
        };

        images.forEach((imageUrl, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-label', `검사 사진 ${index + 1} 보기`);
          button.setAttribute('aria-current', 'false');
          const thumbnail = document.createElement('img');
          thumbnail.src = imageUrl;
          thumbnail.alt = '';
          button.append(thumbnail);
          button.addEventListener('click', () => showImage(imageUrl, index));
          detailThumbnails.append(button);
        });
        showImage(images[0], 0);
      }

      function populateDetailProductOptions(selectedProductId) {
        const productOptions = [
          ['P-SILVER', '은색 텀블러'],
          ['P-WHITE', '흰색 텀블러'],
          ['P-BLACK', '검정 텀블러'],
        ];
        document.querySelector('#detail-edit-product').replaceChildren(...productOptions.map(([id, label]) => {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = label;
          option.selected = id === selectedProductId;
          return option;
        }));
      }

      function setDefaultInspectionDate() {
        const now = new Date();
        const koreaTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
        const pad = (value) => String(value).padStart(2, '0');
        inspectedAtInput.value = `${koreaTime.getFullYear()}-${pad(koreaTime.getMonth() + 1)}-${pad(koreaTime.getDate())}T${pad(koreaTime.getHours())}:${pad(koreaTime.getMinutes())}:${pad(koreaTime.getSeconds())}`;
      }

      async function loadProducts() {
        try {
          const response = await fetch('/api/products');
          const products = await response.json();
          if (!response.ok || !Array.isArray(products)) throw new Error('제품 목록을 불러오지 못했습니다.');
          const selected = productSelect.value;
          productSelect.replaceChildren(...products.map((product) => {
            const option = document.createElement('option');
            option.value = product.product_id;
            option.textContent = product.label;
            return option;
          }));
          if (products.some((product) => product.product_id === selected)) productSelect.value = selected;
          loadWeightRange();
        } catch (error) {
          weightRange.textContent = error.message || '제품 목록을 불러오지 못했습니다.';
        }
      }

      async function loadWeightRange() {
        if (!productSelect.value) return;
        try {
          const response = await fetch(`/api/standards/${encodeURIComponent(revisionSelect.value)}`);
          const standard = await response.json();
          if (!response.ok) throw new Error(standard.error || '검사기준을 불러오지 못했습니다.');
          const range = standard.weight_g?.[productSelect.value];
          if (!range) throw new Error('제품의 기준 중량을 찾을 수 없습니다.');
          weightRange.textContent = `기준 중량: ${range.min}~${range.max}g`;
        } catch (error) {
          weightRange.textContent = error.message || '검사기준을 불러오지 못했습니다.';
        }
      }

      function showApp(user) {
        loginBox.hidden = true;
        appScreen.hidden = false;
        headerUser.textContent = `${user.username} (${roleLabels[user.role] || user.role})`;
        headerActions.hidden = false;
        yellowNotice.hidden = false;
        appFooter.hidden = false;
        renderScreen();
      }

      async function checkLogin() {
        try {
          const response = await fetch('/api/session');
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || '로그인 상태를 확인하지 못했습니다.');
          }
          if (result.user) {
            showApp(result.user);
          } else {
            appScreen.hidden = true;
            headerActions.hidden = true;
            yellowNotice.hidden = true;
            appFooter.hidden = true;
            loginBox.hidden = false;
          }
        } catch (error) {
          showLoginError(error.message || '로그인 상태를 확인하지 못했습니다.');
        }
      }

      function renderLoginResult(result) {
        if (result && Object.prototype.hasOwnProperty.call(result, 'error')) {
          showLoginError(result.error || '로그인 정보를 확인하세요.');
          return;
        }
        if (!result.user) {
          showLoginError('로그인 정보를 확인하세요.');
          return;
        }
        showApp(result.user);
      }

      function navigate(path) {
        if (window.location.pathname !== path) {
          history.pushState({}, '', path);
        }
        renderScreen();
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.textContent = '';
        loginError.hidden = true;
        loginButton.disabled = true;

        const formData = new FormData(loginForm);
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: formData.get('username'),
              password: formData.get('password'),
            }),
          });
          const result = await response.json();
          renderLoginResult(result);
        } catch (error) {
          showLoginError(error.message || '서버와 통신할 수 없습니다.');
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          const result = await response.json();
          if (!response.ok || result.error || result.user !== null) {
            throw new Error(result.error || '로그아웃하지 못했습니다.');
          }

          loginForm.reset();
          loginError.textContent = '';
          loginError.hidden = true;
          headerUser.textContent = '';
          headerActions.hidden = true;
          yellowNotice.hidden = true;
          appFooter.hidden = true;
          appScreen.hidden = true;
          loginBox.hidden = false;
        } catch (error) {
          showLoginError(error.message || '로그아웃하지 못했습니다.');
          loginBox.hidden = false;
        } finally {
          logoutButton.disabled = false;
        }
      });

      productSelect.addEventListener('change', loadWeightRange);
      revisionSelect.addEventListener('change', loadWeightRange);
      homeDate.addEventListener('change', loadHomeSummary);
      document.querySelectorAll('[data-home-filter]').forEach((card) => {
        card.addEventListener('click', () => {
          const selected = card.dataset.homeFilter;
          if (selected === 'all') activeHomeFilter = null;
          else activeHomeFilter = activeHomeFilter === selected ? null : selected;
          updateHomeFilterSelection();
          void loadHomeInspections();
        });
      });

      function updateHomeFilterSelection() {
        document.querySelectorAll('[data-home-filter]').forEach((card) => {
          card.setAttribute('aria-pressed', String(card.dataset.homeFilter === activeHomeFilter));
        });
      }

      if (homeTumbler && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const tumblerStage = homeTumbler.closest('.home-tumbler-stage');
        let pointerFrame = 0;
        let pointerX = 0;
        let pointerY = 0;

        tumblerStage.addEventListener('pointermove', (event) => {
          const bounds = tumblerStage.getBoundingClientRect();
          pointerX = (event.clientX - bounds.left) / bounds.width * 2 - 1;
          pointerY = (event.clientY - bounds.top) / bounds.height * 2 - 1;
          if (pointerFrame) return;
          pointerFrame = window.requestAnimationFrame(() => {
            homeTumbler.style.setProperty('--tumbler-x', `${pointerX * 28}px`);
            homeTumbler.style.setProperty('--tumbler-y', `${pointerY * 20}px`);
            homeTumbler.style.setProperty('--tumbler-rotate', `${pointerX * 14}deg`);
            pointerFrame = 0;
          });
        });

        tumblerStage.addEventListener('pointerleave', () => {
          if (pointerFrame) window.cancelAnimationFrame(pointerFrame);
          pointerFrame = 0;
          homeTumbler.style.setProperty('--tumbler-x', '0px');
          homeTumbler.style.setProperty('--tumbler-y', '0px');
          homeTumbler.style.setProperty('--tumbler-rotate', '0deg');
        });
      }

      detailTabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectDetailTab(index));
      });
      detailEditForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        detailEditError.hidden = true;
        if (!detailEditForm.reportValidity()) return;

        detailEditSave.disabled = true;
        const dateValue = document.querySelector('#detail-edit-date').value;
        const weightValue = document.querySelector('#detail-edit-weight').value;
        try {
          const response = await fetch(`/api${window.location.pathname}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              product_id: document.querySelector('#detail-edit-product').value,
              inspected_at: `${dateValue.replace('T', ' ')}${dateValue.length === 16 ? ':00' : ''}`,
              weight_g: weightValue === '' ? null : Number(weightValue),
            }),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '저장하지 못했습니다.');
          }
          await loadInspectionDetail(decodeURIComponent(window.location.pathname.split('/').pop()));
        } catch (error) {
          detailEditError.textContent = error.message || '저장하지 못했습니다.';
          detailEditError.hidden = false;
        } finally {
          detailEditSave.disabled = false;
        }
      });
      inspectionForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        inspectionSubmitError.hidden = true;
        inspectionSubmitResult.hidden = true;

        if (!inspectionForm.reportValidity()) return;
        if (selectedImageDataUrls.length === 0) {
          inspectionSubmitError.textContent = '사진을 골라 주세요.';
          inspectionSubmitError.hidden = false;
          return;
        }

        inspectionSubmit.disabled = true;
        const dateTime = inspectedAtInput.value;
        const payload = {
          product_id: productSelect.value,
          inspected_at: dateTime ? `${dateTime.replace('T', ' ')}${dateTime.length === 16 ? ':00' : ''}` : '',
          revision: revisionSelect.value,
          weight_g: document.querySelector('#weight-input').value === ''
            ? null
            : Number(document.querySelector('#weight-input').value),
          memo: document.querySelector('#memo-input').value,
          images: selectedImageDataUrls,
        };

        try {
          const response = await fetch('/api/inspections', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result.error || '검사를 등록하지 못했습니다.');
          }
          inspectionSubmitResult.textContent = `검사를 등록했습니다. 검사번호: ${result.inspection_id}`;
          inspectionSubmitResult.hidden = false;
        } catch (error) {
          inspectionSubmitError.textContent = error.message || '검사를 등록하지 못했습니다.';
          inspectionSubmitError.hidden = false;
        } finally {
          inspectionSubmit.disabled = false;
        }
      });
      inspectionImages.addEventListener('change', async () => {
        const selectionVersion = ++imageSelectionVersion;
        selectedImageDataUrls = [];
        imagePreviews.replaceChildren();
        const files = Array.from(inspectionImages.files || []);

        try {
          selectedImageDataUrls = await Promise.all(files.map((file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.addEventListener('load', () => {
              if (typeof reader.result === 'string') resolve(reader.result);
              else reject(new Error('사진을 읽지 못했습니다.'));
            });
            reader.addEventListener('error', () => reject(new Error('사진을 읽지 못했습니다.')));
            reader.readAsDataURL(file);
          })));

          if (selectionVersion !== imageSelectionVersion) return;
          selectedImageDataUrls.forEach((dataUrl, index) => {
            const preview = document.createElement('img');
            preview.src = dataUrl;
            preview.alt = files[index].name;
            imagePreviews.append(preview);
          });
        } catch {
          if (selectionVersion === imageSelectionVersion) {
            selectedImageDataUrls = [];
            imagePreviews.textContent = '사진을 읽지 못했습니다.';
          }
        }
      });

      document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element)) return;
        const target = event.target;
        const link = target.closest('a[data-link]');
        if (
          !link ||
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        const destination = new URL(link.href, window.location.href);
        if (destination.origin !== window.location.origin) return;
        event.preventDefault();
        navigate(`${destination.pathname}${destination.search}${destination.hash}`);
      });

      window.addEventListener('popstate', () => {
        if (loginBox.hidden) {
          renderScreen();
        }
      });

      checkLogin();
    </script>
  </body>
</html>
